name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-2025
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      INNO_VERSION: "7.0.2"
      INNO_URL: "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.423

      - name: Test
        shell: pwsh
        run: dotnet test AgentRelay.sln -c Release --nologo

      - name: Publish self-contained x64
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF_NAME.Substring(1)
          } else { "0.3.2-ci" }
          dotnet publish src/AgentRelay.App/AgentRelay.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            "-p:Version=$version" `
            -o artifacts/publish --nologo

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest $env:INNO_URL -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\innosetup.exe"
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys") {
            throw "Invalid Inno Setup signature: $($signature.Status)"
          }
          $process = Start-Process "$env:RUNNER_TEMP\innosetup.exe" `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$env:RUNNER_TEMP\inno`"" `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed." }

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force outputs | Out-Null
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF_NAME.Substring(1)
          } else { "0.3.2" }
          & "$env:RUNNER_TEMP\inno\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DPublishDir=$pwd\artifacts\publish" `
            "/DOutputDir=$pwd\outputs" `
            "installer\AgentRelay.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed." }
          $hash = (Get-FileHash -Algorithm SHA256 "outputs/AgentRelaySetup-x64.exe").Hash
          "$hash  AgentRelaySetup-x64.exe" |
            Set-Content -Encoding ascii "outputs/AgentRelaySetup-x64.exe.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: AgentRelaySetup-x64
          path: |
            outputs/AgentRelaySetup-x64.exe
            outputs/AgentRelaySetup-x64.exe.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          "outputs/AgentRelaySetup-x64.exe"
          "outputs/AgentRelaySetup-x64.exe.sha256"
          --generate-notes
